name: Build and Test on Release

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ip-analyzer-linux-x86_64
            binary_path: build/ip-analyzer
            linker_flags: -static-libgcc -static-libstdc++
            osx_archs: ""
            msvc_runtime: ""
          - os: macos-latest
            artifact: ip-analyzer-macos-universal
            binary_path: build/ip-analyzer
            linker_flags: ""
            osx_archs: arm64;x86_64
            msvc_runtime: ""
          - os: windows-latest
            artifact: ip-analyzer-windows-x86_64.exe
            binary_path: build/Release/ip-analyzer.exe
            linker_flags: ""
            osx_archs: ""
            msvc_runtime: MultiThreaded
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++-14 gcc-14
          echo "CXX=g++-14" >> "$GITHUB_ENV"
          echo "CC=gcc-14" >> "$GITHUB_ENV"

      - name: Configure Release Build
        shell: bash
        env:
          LINKER_FLAGS: ${{ matrix.linker_flags }}
          OSX_ARCHS: ${{ matrix.osx_archs }}
          MSVC_RUNTIME: ${{ matrix.msvc_runtime }}
        run: |
          extra=()
          if [[ -n "$LINKER_FLAGS" ]]; then
            extra+=("-DCMAKE_EXE_LINKER_FLAGS=$LINKER_FLAGS")
          fi
          if [[ -n "$OSX_ARCHS" ]]; then
            extra+=("-DCMAKE_OSX_ARCHITECTURES=$OSX_ARCHS")
          fi
          if [[ -n "$MSVC_RUNTIME" ]]; then
            extra+=("-DCMAKE_MSVC_RUNTIME_LIBRARY=$MSVC_RUNTIME")
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "${extra[@]}"

      - name: Build Project
        run: cmake --build build --config Release

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary_path }}" "dist/${{ matrix.artifact }}"
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x "dist/${{ matrix.artifact }}"
            strip "dist/${{ matrix.artifact }}" || true
          fi

      - name: Smoke test binary
        shell: bash
        run: |
          "./dist/${{ matrix.artifact }}" --version
          "./dist/${{ matrix.artifact }}" --ip 192.168.1.1/24 --json --no-color

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

      - name: Attach binary to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release upload
          "${{ github.event.release.tag_name }}"
          "dist/${{ matrix.artifact }}"
          --clobber
