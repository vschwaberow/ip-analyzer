name: Build and Test on Release

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            cxx: g++-14
            cc: gcc-14
          - os: macos-latest
            arch: arm64
            cxx: clang++
            cc: clang
          - os: windows-latest
            arch: amd64
            cxx: cl
            cc: cl
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install dependencies for Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++-14 gcc-14
          echo "CXX=g++-14" >> $GITHUB_ENV
          echo "CC=gcc-14" >> $GITHUB_ENV

      - name: Install dependencies for macOS
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake

      - name: Configure Release Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: |
          cmake --build build --config Release

      - name: Run Tests
        if: runner.os != 'Windows'
        run: |
          ctest --test-dir build --output-on-failure

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ip-analyzer-${{ matrix.os }}-${{ matrix.arch }}
          path: build/ip-analyzer*
